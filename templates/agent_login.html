<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShieldScan | Agent Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #07141d;
      --bg-2: #0d2430;
      --panel: rgba(12, 26, 36, 0.78);
      --line: rgba(184, 236, 255, 0.28);
      --text: #f4fbff;
      --muted: #95b7c4;
      --accent: #00d4ff;
      --shadow: 0 20px 55px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.2), transparent 45%),
        linear-gradient(120deg, var(--bg-1), var(--bg-2));
    }

    .page {
      width: min(520px, 92%);
      margin: 0 auto;
      padding: 52px 0;
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(52px, 11vw, 84px);
      letter-spacing: 0.03em;
      line-height: 0.95;
      margin-bottom: 12px;
    }

    .subtitle,
    .error,
    .switch {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 26px;
    }

    label {
      display: block;
      color: #d3f3ff;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(167, 234, 255, 0.32);
      background: rgba(9, 22, 30, 0.88);
      border-radius: 12px;
      color: #e8fbff;
      font: inherit;
      margin-bottom: 16px;
      padding: 13px 14px;
    }

    .password-field {
      position: relative;
      margin-bottom: 16px;
    }

    .password-field input {
      margin-bottom: 0;
      padding-right: 52px;
    }

    .toggle-password {
      align-items: center;
      background: transparent;
      border: none;
      color: rgba(211, 243, 255, 0.24);
      cursor: pointer;
      display: none;
      height: 42px;
      justify-content: center;
      min-height: 0;
      padding: 0;
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
    }

    .toggle-password svg {
      height: 22px;
      pointer-events: none;
      width: 22px;
    }

    .password-eye .eye-pupil {
      display: none;
    }

    .toggle-password.password-visible .eye-pupil {
      display: block;
    }

    .toggle-password.password-visible .eye-lid {
      display: none;
    }

    .password-field.has-value .toggle-password {
      display: inline-flex;
      pointer-events: auto;
    }

    .toggle-password:hover {
      color: rgba(211, 243, 255, 0.5);
    }

    .toggle-password.blink svg {
      animation: eye-blink 260ms ease-in-out;
      transform-origin: center;
    }

    @keyframes eye-blink {
      0%,
      100% {
        transform: scaleY(1);
      }

      45%,
      55% {
        transform: scaleY(0.12);
      }
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00d4ff, #ff9f43);
      color: #04121a;
      cursor: pointer;
      font-weight: 700;
      min-height: 50px;
      padding: 0 20px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    .error {
      color: #ffd0d0;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Agent Login</h1>
    <p class="subtitle">Agents can review alert-zone URLs and approve the final output for users.</p>

    <section class="card">
      <form method="POST">
        <label for="username">Agent username</label>
        <input id="username" name="username" type="text" placeholder="agent" required>

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" placeholder="password" required>
          <button class="toggle-password" type="button" data-toggle-password="password" aria-label="Show password" title="Show password">
            <svg class="password-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
              <circle class="eye-pupil" cx="12" cy="12" r="3"></circle>
              <path class="eye-lid" d="M8 12h8"></path>
            </svg>
          </button>
        </div>

        <button type="submit">Open Agent Monitor</button>
      </form>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <p class="switch"><a href="/login">User login</a></p>
    </section>
  </main>
  <script>
    document.querySelectorAll("[data-toggle-password]").forEach((button) => {
      const input = document.getElementById(button.dataset.togglePassword);
      const field = button.closest(".password-field");

      const setIconState = (passwordVisible) => {
        button.classList.toggle("password-visible", passwordVisible);
      };

      const syncField = () => {
        field.classList.toggle("has-value", input.value.length > 0);
        if (!input.value) {
          input.type = "password";
          button.setAttribute("aria-label", "Show password");
          button.setAttribute("title", "Show password");
        }
        setIconState(input.type === "text");
      };

      syncField();
      input.addEventListener("input", syncField);

      button.addEventListener("click", () => {
        const visible = input.type === "text";
        input.type = visible ? "password" : "text";
        button.setAttribute("aria-label", visible ? "Show password" : "Hide password");
        button.setAttribute("title", visible ? "Show password" : "Hide password");
        setIconState(!visible);
        if (visible) {
          button.classList.remove("blink");
          void button.offsetWidth;
          button.classList.add("blink");
        }
      });

      button.addEventListener("animationend", () => {
        button.classList.remove("blink");
      });
    });
  </script>
</body>
</html>
